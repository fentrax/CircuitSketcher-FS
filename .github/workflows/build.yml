name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest tests/ -q

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name SchaltungsZeichner-FS
          --icon assets/favicon.ico
          --add-data "assets;assets" --add-data "symbols;symbols" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: SchaltungsZeichner-FS-windows-x64
          path: dist/

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      # Quadratisches Icon -> macOS .icns (iconutil)
      - run: |
          mkdir icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s assets/icon-1024.png --out icon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) assets/icon-1024.png --out icon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns icon.iconset
      - run: pyinstaller --noconfirm --windowed --name SchaltungsZeichner-FS
          --icon icon.icns --hidden-import PyQt5.QtSvg
          --add-data "assets:assets" --add-data "symbols:symbols" main.py
      - run: hdiutil create -volname "SchaltungsZeichner FS"
          -srcfolder "dist/SchaltungsZeichner-FS.app" -ov -format UDZO SchaltungsZeichner-FS.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: SchaltungsZeichner-FS-macos
          path: SchaltungsZeichner-FS.dmg
